{#
  The summary email (HTML). Styles must be inline, because mail apps ignore <style> blocks.
  Placeholders:
    kind_label: Summary / While you were focused / End of day
    period: e.g. Mon Oct 26
    summary_html: the summary, already turned into HTML (keep the "| safe")
    summary_markdown: the summary as plain text/Markdown
    ui_link: opens the summary in the Webex Focus web page
#}
<!doctype html>
<html>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;color:#1f2328;">
  <div style="max-width:640px;margin:0 auto;background:#ffffff;border-radius:12px;padding:28px 32px;border:1px solid #e3e5e8;">
    <div style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;margin-bottom:4px;">Webex Focus</div>
    <div style="font-size:20px;font-weight:600;margin-bottom:16px;">{{ kind_label }} · {{ period }}</div>
    <div style="font-size:15px;line-height:1.55;">{{ summary_html | safe }}</div>
    <div style="margin-top:24px;padding-top:16px;border-top:1px solid #e3e5e8;font-size:13px;color:#6b7280;">
      Open it in Webex Focus: <a href="{{ ui_link }}" style="color:#0b6bcb;">{{ ui_link }}</a>
    </div>
  </div>
</body>
</html>
